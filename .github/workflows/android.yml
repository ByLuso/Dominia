name: 📱 Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  apk:
    name: 📱 Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Some bundled flag file names are not ASCII; the JVM must read paths
      # as UTF-8 or Gradle cannot find them.
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      # The Dominia server the app plays private lobbies on: the Render
      # service (render.yaml), unless the repository variables
      # DOMINIA_SERVER / DOMINIA_SERVER_WORKERS (Settings > Secrets and
      # variables > Actions > Variables) name another. That server must run
      # this same commit: it only admits clients built from it.
      - run: npm run build-app
        env:
          DOMINIA_SERVER: ${{ vars.DOMINIA_SERVER || 'dominia-8fm9.onrender.com' }}
          DOMINIA_SERVER_WORKERS: ${{ vars.DOMINIA_SERVER_WORKERS || '1' }}
      - run: npx cap sync android
      # The runner image ships JDK 21 (what Capacitor 8 needs) and the
      # Android SDK; this only selects that JDK.
      - name: Build debug APK
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: dominia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
